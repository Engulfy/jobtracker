name: Singapore tech job scan

on:
  schedule:
    # Every 2 hours, at :17 (UTC; SGT also falls on odd hours)
    - cron: '17 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sg-tech-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest -v
      - name: Collect jobs, notify, and export dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python tracker.py
      - name: Save current and historical jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json docs/jobs.json docs/jobs.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: update job listings [skip ci]"
            git push
          fi
