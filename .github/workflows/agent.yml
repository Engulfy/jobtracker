name: Free cloud job agent

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sg-tech-job-scan
  cancel-in-progress: false

jobs:
  agent:
    if: vars.AGENT_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require free public-repository hosting
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "false" ]; then
            echo "This zero-cost workflow requires a public repository and standard runner."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run cloud agent once
        id: tick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_DAILY_REQUESTS: '15'
          GEMINI_RUN_REQUESTS: '6'
          AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_KEY }}
          AGENT_PROFILE_JSON: ${{ secrets.AGENT_PROFILE_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_AGENT_HOME: ${{ github.workspace }}/private
        run: python cloud.py run
      - name: Persist public listings and encrypted private state
        if: always() && (steps.tick.outcome == 'success' || steps.tick.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json docs/jobs.json docs/jobs.csv
          for file in data/agent-state.enc data/agent-state.initialized; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update cloud job agent [skip ci]"
            git push
          fi
